name: Build installers

# Builds 64-bit installers on real machines for each OS:
#   Windows: .msi (x64 + ARM64)   macOS: .dmg (Apple Silicon + Intel)   Linux: AppImage + .deb (x64 + ARM64)
# Run by hand: a test build (Actions artifacts, kept 90 days), or tick "Publish as a release".
# "Test build: Windows x64 installer only" builds just the x64 .msi, faster; such a run never publishes.
# Push a tag like v0.9.0, or run with "Publish as a release": a permanent GitHub Release for the
# version in package.json, with every installer attached.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish as a release (version from package.json)
        type: boolean
        default: false
      windows_x64_only:
        description: "Test build: Windows x64 installer only (never published)"
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to exact commits (the comment shows the version). Dependabot proposes updates
# as pull requests (.github/dependabot.yml), so a moved tag can never change what runs here.

jobs:
  # First, so a tag on a commit outside main fails before any installer is built. Other runs pass straight through.
  check-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        with:
          persist-credentials: false
          # The whole history, so the next step can tell whether this commit is part of main.
          fetch-depth: 0
      # A version tag pushed on a commit that never reached main (e.g. a pull request branch) is not published.
      - name: Check that the commit is on main
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is not part of origin/main. Only commits that are on main are published."
            exit 1
          fi

  build:
    needs: check-main
    strategy:
      fail-fast: false
      matrix:
        # The input is empty on tag pushes, so everything is built there.
        include: ${{ fromJSON(inputs.windows_x64_only && '[{"os":"windows-latest","dist":"dist:win"}]' || '[{"os":"windows-latest","dist":"dist:win"},{"os":"macos-latest","dist":"dist:mac"},{"os":"ubuntu-latest","dist":"dist:linux"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Go builds the kasboek-mcp helper (tools/kasboek-mcp).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/kasboek-mcp/go.mod
          cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:mcp
      - run: npm test
      - run: npm run check:i18n
      # Without an Apple Developer ID the app is ad-hoc signed (required on Apple Silicon);
      # set CSC_LINK / CSC_KEY_PASSWORD secrets to sign properly.
      - name: Build installers
        shell: bash
        run: |
          # An empty CSC_LINK would be read as a file path: drop signing settings that aren't set.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          extra=""
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then extra="--config.mac.identity=-"; fi
          # The msi targets in electron-builder.yml name their architectures, which win over --x64;
          # a target given on the command line ("msi:x64") replaces them, so only the x64 MSI is built.
          if [ "$RUNNER_OS" = "Windows" ] && [ "$WINDOWS_X64_ONLY" = "true" ]; then extra="--win msi:x64"; fi
          npm run ${{ matrix.dist }} -- --publish never $extra
        env:
          WINDOWS_X64_ONLY: ${{ inputs.windows_x64_only }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # The app package must hold only the built app, never sources, tests or old releases.
      - name: Check the app package contents
        shell: bash
        run: bash scripts/check-package.sh release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kasboek-${{ runner.os }}
          path: |
            release/*/*.msi
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb
          if-no-files-found: error
      # A real upgrade on a Windows runner: the previous release's MSI is installed, a kasboek-mcp
      # bridge is started from its folder, then the MSI just built is installed over it silently
      # (what the updater does). Only in test builds, after the installers are uploaded, and nothing
      # in the release job waits for it, so it can't hold up or break a release. x64 only: the
      # runner is x64 and a 64-bit ARM Windows runner is not assumed.
      - name: Windows upgrade smoke test (MSI upgrade while a Claude bridge runs)
        if: runner.os == 'Windows' && !inputs.release && !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $old = Join-Path $env:RUNNER_TEMP 'old'
          New-Item -ItemType Directory -Force -Path $old | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern 'Kasboek-*-win-x64.msi' --dir $old
          $oldMsi = (Get-ChildItem $old -Filter '*.msi' | Select-Object -First 1).FullName
          $newMsi = (Get-ChildItem "release/$version" -Filter '*-win-x64.msi' | Select-Object -First 1).FullName
          ./scripts/msi-upgrade-smoke.ps1 -OldMsi $oldMsi -NewMsi $newMsi -NewVersion $version

  release:
    # Publishing only from main or a version tag, never from another branch, and never after a
    # Windows-only test build (a release needs every installer).
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.release) && !inputs.windows_x64_only && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    # A protected environment: in the repository settings, require reviewers for "release".
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can tell whether this commit is part of main.
          fetch-depth: 0
      # A version tag pushed on a commit that never reached main (e.g. a pull request branch) is not published.
      - name: Check that the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is not part of origin/main. Only commits that are on main are published."
            exit 1
          fi
      - name: Work out the version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi
          echo "TAG=$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Kasboek's updater checks each download against GitHub's own checksum; this file is the
      # fallback, and lets anyone check a download by hand.
      - name: Checksums
        run: |
          for f in $(find dist -type f); do sha256sum "$f" | awk -v n="$(basename "$f")" '{print $1 "  " n}'; done | sort -k2 > SHA256SUMS.txt
          mv SHA256SUMS.txt dist/
          cat dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Made by hand (e.g. "Draft a new release" on GitHub): add the installers to it, but
            # never replace files. A version number is built once.
            assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
            if [ "$assets" != "0" ]; then
              echo "Release $TAG already has $assets file(s). A version is never built twice: raise the version in package.json and build again."
              exit 1
            fi
            gh release upload "$TAG" $(find dist -type f) --repo "$GITHUB_REPOSITORY"
          else
            # Creates the tag on the built commit. GitHub refuses this from a workflow when that
            # commit changes workflow files not yet on the default branch; then create the release
            # (and its tag) on GitHub first and run this again.
            gh release create "$TAG" $(find dist -type f) \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kasboek ${TAG#v}" \
              --notes-file .github/release-notes.md
          fi
